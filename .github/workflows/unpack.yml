name: Unpack PricePilot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find PricePilot ZIP
        id: find_zip
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'pricepilot-*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No PricePilot ZIP found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract PricePilot
        run: |
          ZIP="${{ steps.find_zip.outputs.zip }}"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "Extraction completed."

      - name: Locate project folder
        run: |
          echo "Extracted structure:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Copy project files
        run: |
          SOURCE="extracted"

          FIRST_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$FIRST_DIR" ]; then
            SOURCE="$FIRST_DIR"
            echo "Project folder detected: $SOURCE"
          fi

          cp -a "$SOURCE"/. .

      - name: Remove ZIP and temporary files
        run: |
          rm -f pricepilot-*.zip
          rm -rf extracted

      - name: Show final structure
        run: |
          echo "Final PricePilot structure:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -150

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PricePilot project"
            git push
          fi
