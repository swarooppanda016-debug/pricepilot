name: Unpack PricePilot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check ZIP
        run: |
          if [ ! -f "pricepilot-v4-commercial.zip" ]; then
            echo "ZIP file not found."
            exit 0
          fi

      - name: Extract PricePilot
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "pricepilot-v4-commercial.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Copy project files
        run: |
          SOURCE="extracted"

          FIRST_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          if [ -n "$FIRST_DIR" ]; then
            echo "Project folder detected: $FIRST_DIR"
            SOURCE="$FIRST_DIR"
          fi

          cp -a "$SOURCE"/. .

      - name: Remove ZIP and temporary files
        run: |
          rm -f pricepilot-v4-commercial.zip
          rm -rf extracted

      - name: Show final structure
        run: |
          echo "Final repository:"
          find . -maxdepth 2 -type f \
            ! -path "./.git/*" \
            | sort | head -150

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract PricePilot project"
            git push
          fi
